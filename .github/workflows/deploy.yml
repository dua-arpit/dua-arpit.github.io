name: Publish site

# The site is plain HTML committed in the repository root, so nothing is built here.
# This job only copies those files to the gh-pages branch. It is a fallback:
# with Settings > Pages > "Deploy from a branch: master / (root)", GitHub serves
# the root directly and this job is not needed.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _publish
          cp -r index.html 404.html style.css robots.txt .nojekyll publications group cv people news teaching repositories assets _publish/
          if [ -d logos ]; then cp -r logos _publish/; fi
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _publish
          branch: gh-pages
          clean: true

research:
  - glyph: tanner
    title: High-rate qLDPC codes
    text: Bivariate bicycle, lifted-product, and GALA/Kasai codes for reconfigurable neutral-atom arrays.
  - glyph: surgery
    title: Logical operations
    text: Code and lattice surgery, transversal gates, and magic-state preparation.
  - glyph: decoding
    title: Fault-tolerant protocols
    text: Dynamical and Floquet codes, spacetime concatenation, and decoders.
  - glyph: fracton
    title: Topological order
    text: Fracton and fermionic stabilizer codes, subsystem symmetries, and topological phases as a source of codes.
  - glyph: atoms
    title: Architectures
    text: Fault-tolerant architectures and resource estimates for cryptographically relevant workloads, with AI-assisted co-design.


group:
  intro: Prospective students and postdocs are welcome to contact me at adua@vt.edu.
  members:
    - name: Jagannath Das
      role: Postdoctoral researcher
      photo: assets/img/jagannath.jpg
      bio: >-
        Jagannath completed his PhD at the Tata Institute of Fundamental Research, India, under the
        supervision of Prof. Vikram Tripathi. His primary focus has been theoretical condensed matter
        physics, and he is now exploring quantum information. His research interests include strongly
        correlated systems, especially quantum spin liquids, topological phases of matter, and
        topological quantum computing.
      email: jagannath.das0111@gmail.com
    - name: Pedro Medina
      role: Graduate student
      photo: assets/img/pedro.jpg
      bio: >-
        Pedro is a Ph.D. student in Physics at Virginia Tech. He is interested in the construction and
        properties of qLDPC codes, their performance under different noise models, and the development
        of decoding strategies. His current research focuses on single-shot decoding and understanding
        the scaling behavior of logical error rates in qLDPC codes.
    - name: Chuen Hei Chan
      role: Graduate student
      photo: assets/img/chuenhei.jpg
      bio: >-
        Chuen Hei is a Ph.D. student in Physics and is interested in topological order in quantum
        information and the algebraic structure of qLDPC codes. His current work focuses on designing and
        optimizing qLDPC codes to reduce physical-qubit overhead while preserving logical capacity and code
        distance. He has also been working with Prof. Sophia Economou and Prof. Edwin Barnes on quantum
        network and photonic graph state generation, and his broader research interests include the
        interplay between quantum error correction, quantum networks, and distributed quantum computing.
    - name: Alexander Shupp
      role: Research assistant
      photo: assets/img/alexander.jpg
      bio: >-
        Alexander completed his BS in Physics at Virginia Tech in May 2026. He currently works as a
        research assistant, developing graphical methods to represent known Majorana fermion codes and
        construct new ones. His research interests include quantum error correction, graphical tensor
        calculi, and topological quantum computing.
  alumni:
    - name: Sayandip Dhara
      role: Postdoctoral researcher
      photo: assets/img/sayandip.jpg
      now: Quantum Error Correction Researcher, Welinq, Paris, France

name: Arpit Dua
url: https://dua-arpit.github.io
description: Arpit Dua. Quantum error correction, quantum LDPC codes, and fault-tolerant quantum computing.

roles:
  - title: Principal Quantum Scientist
    org: QuEra Computing
    href: https://www.quera.com/
  - title: Assistant Professor of Physics
    org: Virginia Tech
    href: https://www.phys.vt.edu/

bio:
  - >-
    I am a Principal Quantum Scientist at <a href="https://www.quera.com/">QuEra Computing</a>,
    where I lead the collaboration with NVIDIA and manage QuEra's work in the Quantum
    Benchmarking Initiative (QBI). I am also an Assistant Professor in the Department of
    Physics at Virginia Tech. Before this, I was a Joint
    <a href="https://projects.iq.harvard.edu/ultra-qm/home">Simons</a>–<a href="https://iqim.caltech.edu/">IQIM</a>
    postdoc at Caltech with Xie Chen and a PhD student at Yale University with Meng Cheng
    and Liang Jiang.
  - >-
    My group at Virginia Tech works on quantum error correction, fault-tolerant quantum computation,
    and topological order.


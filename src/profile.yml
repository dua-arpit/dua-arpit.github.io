  members:
    - name: Sayandip Dhara
      photo: assets/img/sayandip.jpg
      bio: >-
        Sayandip completed his PhD at the University of Central Florida under the supervision of
        Prof. Eduardo Mucciolo. He is a theoretical and computational physicist interested in quantum
        many-body systems and quantum information. His current research focuses on fault-tolerant
        quantum architectures and error-correcting codes. He also has a keen interest in machine
        learning architectures.
      email: sayandip@vt.edu
    - name: Jagannath Das
      photo: assets/img/jagannath.jpg
      bio: >-
        Jagannath completed his PhD at the Tata Institute of Fundamental Research, India, under the
        supervision of Prof. Vikram Tripathi. His primary focus has been theoretical condensed matter
        physics, and he is now exploring quantum information. His research interests include strongly
        correlated systems, especially quantum spin liquids, topological phases of matter, and
        topological quantum computing.
      email: jagannath.das0111@gmail.com

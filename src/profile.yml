bio:
  - >-
    I am a Principal Quantum Scientist at <a href="https://www.quera.com/">QuEra Computing</a>
    and an Assistant Professor in the Department of Physics at Virginia Tech. Before this, I was a Joint
    <a href="https://projects.iq.harvard.edu/ultra-qm/home">Simons</a>–<a href="https://iqim.caltech.edu/">IQIM</a>
    postdoc at Caltech with Xie Chen and a PhD student at Yale University with Meng Cheng
    and Liang Jiang.
  - >-
    My group at Virginia Tech works on quantum error correction, fault-tolerant quantum computation,
    and topological order.

